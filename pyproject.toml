# Корень uv workspace. Сам корень не собирается в пакет (package = false):
# он нужен только для разработки — ставит все сервисы в одно окружение для тестов и линтеров.
# В Docker-образах каждый сервис ставится отдельно: `uv sync --package <сервис>` (SPEC.md §11).
[project]
name = "qoima-vision"
version = "0.1.0"
description = "Qoima Vision — on-prem система промышленной видеоаналитики (корень workspace)"
requires-python = ">=3.11"
dependencies = [
    "qoima-shared[postgres,valkey]",
    "qoima-cli",
    "qoima-core-api",
    "qoima-vision-pipeline",
    "qoima-agents",
    "qoima-workers",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.24,<2",
    "mypy>=1.13,<2",
    "ruff>=0.8,<1",
    "httpx>=0.27,<1",
    "types-PyYAML>=6.0.12",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "src/shared",
    "src/cli",
    "src/core_api",
    "src/vision_pipeline",
    "src/agents",
    "src/workers",
]

[tool.uv.sources]
qoima-shared = { workspace = true }
qoima-cli = { workspace = true }
qoima-core-api = { workspace = true }
qoima-vision-pipeline = { workspace = true }
qoima-agents = { workspace = true }
qoima-workers = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "PTH", "ASYNC", "S", "N", "C4", "PIE", "RET"]
ignore = [
    # Длину строк кода держит `ruff format`; E501 остаётся только для длинных строковых
    # литералов с русским текстом, которые форматтер не переносит, — их не дробим.
    "E501",
    # Кириллица в строках и комментариях — норма для этого проекта (интерфейс и плейбуки на русском).
    "RUF001", "RUF002", "RUF003",
    # subprocess вызывается только со списком аргументов без shell=True — это осознанно (CLI, doctor).
    "S603", "S607",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S608", "PTH"]
"src/core_api/db/migrations/**" = ["N999"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

# SPEC.md §12, Фаза 0: strict для shared/ — это контракты, от которых зависят все сервисы.
[[tool.mypy.overrides]]
module = ["shared", "shared.*"]
strict = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: тесты с реальными Postgres/Valkey (нужны переменные QOIMA_TEST_*)",
]
filterwarnings = [
    "error::DeprecationWarning:shared.*",
    # Starlette 1.x рекомендует httpx2 для TestClient; на поведение тестов не влияет.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
