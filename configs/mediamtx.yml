# MediaMTX — рестример камер (SPEC.md §3.2 шаг 3, §4). Здесь только отличия от значений
# по умолчанию MediaMTX 1.21.
#
# Пути камер (<camera_id>/main, <camera_id>/sub) добавляет core-api через API и
# восстанавливает после рестарта MediaMTX (источник правды — БД core-api).

logLevel: info
logDestinations: [stdout]

# API и метрики доступны только из внутренней сети backend (порты 9997/9998 не публикуются
# на хост). Поэтому доступ к api/metrics разрешён без пароля с любого адреса этой сети.
authMethod: internal
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: read
      - action: api
      - action: metrics
  # Публикация потоков — только изнутри контейнера (симулятор камер `qoima sim`, Фаза 1).
  - user: any
    pass:
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish

api: true
apiAddress: :9997
metrics: true
metricsAddress: :9998

rtsp: true
rtspAddress: :8554
# Только TCP: UDP через NAT Docker теряет пакеты, а потеря пакетов — это «битые» кадры.
rtspTransports: [tcp]

webrtc: true
webrtcAddress: :8889          # сигнализация WHEP — только из сети backend (через core-api)
webrtcLocalUDPAddress: :8189  # медиа WebRTC — опубликованный порт
webrtcLocalTCPAddress: :8189  # запасной TCP, если UDP закрыт межсетевым экраном

# Не нужны продукту — выключены, чтобы не открывать лишние порты.
rtmp: false
hls: false
srt: false
moq: false
playback: false
pprof: false

paths: {}
