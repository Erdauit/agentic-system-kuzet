# Qoima Vision — значения по умолчанию.
#
# Здесь все пороги, тайминги и SLO с пояснением «почему такое значение» (SPEC.md §13.5).
# Не правьте этот файл на объекте: переопределения кладите в configs/site.yaml
# (тот же формат, только изменённые ключи, например `defaults: {site: {name: "Цех №3"}}`).
# Проверка: `qoima config validate`.
#
# Пометка «уточняется» означает стартовое значение, которое калибруется на реальных
# камерах объекта в соответствующей фазе. Такие значения перечислены в docs/ASSUMPTIONS.md.

version: 1

site:
  name: "Объект не настроен"   # задаётся в мастере (шаг 1); SPEC.md §0 site_name
  ui_languages: [ru, kk]       # SPEC.md §0
  default_language: ru         # SPEC.md §0: по умолчанию ru
  timezone: Asia/Almaty        # SPEC.md §0
  # График смен по умолчанию — типовой двухсменный 12/12. Меняется в мастере (шаг 1).
  # Нужен для отчётов «за смену», маршрутизации алертов и вопросов в чате.
  shifts:
    - {name: "Дневная", start: "08:00", end: "20:00"}
    - {name: "Ночная", start: "20:00", end: "08:00"}

storage:
  data_root: /var/lib/qoima    # SPEC.md §4: /var/lib/qoima/{clips,frames,datasets,models}
  clips_retention_days: 30     # SPEC.md §7: срок хранения клипов по умолчанию 30 дней
  frames_retention_days: 30    # кадры-доказательства живут столько же, сколько клипы
  # Датасеты дороже собрать заново (разметка человеком), поэтому храним год.
  datasets_retention_days: 365

slo:
  # SPEC.md §6.1 — целевые задержки, по ним строится SLO-панель и алерты для инженеров.
  fall_to_alert_p95_s: 2.0          # падение → алерт (после таймера лежания), p95
  red_zone_to_alert_p95_s: 1.0      # красная зона → алерт, p95
  smoke_fire_candidate_p95_s: 3.0   # кандидат дыма/огня → алерт, p95
  camera_offline_detection_s: 15    # SPEC.md §2.2: отвалившаяся камера видна ≤ 15 с

camera_health:
  check_interval_s: 5        # SPEC.md §5.9: каждая камера проверяется каждые ≤ 5 с
  # Нет ни одного пакета дольше 8 с → поток считается мёртвым. 5 + 8 = 13 с ≤ SLO 15 с
  # (это условие проверяется при загрузке конфига). Меньше 8 с даёт ложные «падения»
  # потока на камерах с длинным GOP и редкими I-кадрами.
  stream_timeout_s: 8
  low_fps_ratio: 0.5         # факт < 50% плана — камера деградировала (уточняется, Фаза 1)
  # Кадр «замёрз», если хэш не меняется 10 с. Меньше — ложные срабатывания на статичных
  # сценах ночью; больше — медленная реакция. Уточняется, Фаза 1.
  frozen_window_s: 10
  black_luma_max: 16         # средняя яркость ≤ 16 из 255 (чёрный уровень BT.601) — «чёрный кадр»
  overexposed_luma_min: 240  # ≥ 240 — пересвет (белый уровень BT.601 = 235 + запас)
  # Резкость < 40% от базовой линии — расфокус (пример из SPEC.md §6.3: «упала на 60%»).
  sharpness_drop_ratio: 0.4
  occlusion_ratio: 0.5       # заслонено > 50% кадра — камера бесполезна для анализа (уточняется)
  # Сдвиг ракурса ≥ 0.6 — полигоны зон невалидны, нужен системный алерт. Оценка: максимум из
  # доли несовпавших ORB-признаков со снапшотом и смещения картинки (см. view_shift_full_displacement).
  # Уточняется на камерах объекта.
  view_shift_alert_score: 0.6
  # Проблема качества (расфокус, заслонение, пересвет…) подтверждается 2 проверками подряд
  # (≤ 10 с) — одиночный кадр с бликом или проходящим человеком не поднимает алерт.
  # «Поток упал» поднимается сразу, без подтверждения: это ограничено SLO 15 с.
  raise_after_checks: 2
  # Алерт снимается после 3 чистых проверок подряд (15 с) — гистерезис против «мигания».
  clear_after_checks: 3
  # Кадр «тот же», если средняя разница миниатюр 160×90 ≤ 0.2 уровня яркости. Замер на симуляторе:
  # норма 3.4–7 (живая сцена; у реальных камер ещё и шум сенсора, часы OSD), заморозка — ровно 0.0.
  # Грубые хэши (dHash 9×8) статичную сцену от замёрзшей не отличают. Уточняется на объекте.
  frozen_max_mad: 0.2
  # Вердикт «замёрз» — минимум по 3 кадрам в окне frozen_window_s (I-кадры раз в 1–3 с).
  frozen_min_samples: 3
  # Анализируемый кадр уменьшается до ширины 320 px: метрики устойчивы, CPU — доли процента.
  analysis_width: 320
  # Заслонение считается по сетке 8×6 плиток: плитка «закрыта», если её резкость упала ниже
  # 15% от базовой линии.
  occlusion_grid: [8, 6]
  occlusion_tile_texture_ratio: 0.15
  view_shift_orb_features: 500   # 500 ORB-точек достаточно для 320×180 и дешево по CPU
  # Смещение картинки на 10% диагонали кадра соответствует полному сдвигу ракурса (оценка 1.0).
  view_shift_full_displacement: 0.1
  # Сцена «узнана», если нашлось ≥ 12 согласованных ORB-пар (RANSAC): тогда судим по смещению.
  # Меньше — сцену не узнать (сильный сдвиг или подмена ракурса) → оценка 1.0. Доля пар как
  # критерий не годится: движущиеся люди и техника снижают её и на неизменном ракурсе
  # (замер: 28 из 213 точек при смещении 2.5 px).
  view_shift_min_inliers: 12
  # ORB дороже остальных проверок, а ракурс меняется редко — проверяем раз в минуту.
  view_shift_check_interval_s: 60
  # Переподключение к потоку: 1 → 2 → 4 → 5 с. Не больше 5 с, чтобы вернувшаяся камера
  # снова стала зелёной быстро.
  reconnect_backoff_min_s: 1
  reconnect_backoff_max_s: 5
  # vision-pipeline молчит 15 с (нет снимков Camera Health) → все камеры «нет данных» и
  # системный алерт: тишина ≠ норма (SPEC.md §2.2).
  pipeline_silence_s: 15

pipeline:
  backend: lite              # SPEC.md §5.11: сначала lite, deepstream — Фаза 9
  decode: auto               # SPEC.md §5.3: NVDEC, если FFmpeg видит CUDA; иначе CPU (cpu/nvdec — принудительно)
  substream_max_height: 720  # SPEC.md §5.1: анализ только на substream ≤ 720p
  gop_buffer_seconds: 60     # SPEC.md §5.2: сжатые пакеты последних 60 с в RAM
  # Потолок памяти буфера на поток: 64 МБ ≈ 60 с mainstream 8 Мбит/с. Камера с битрейтом выше
  # хранит меньше 60 с (в UI и логе — предупреждение), но память сервера не кончится.
  gop_max_mb_per_stream: 64
  inference:
    gpu_memory:
      # Лимиты на ОДНУ сессию модели, в МиБ. null — ещё не измерены на целевом GPU;
      # после приёмки задать в site.yaml. Не подменяем измерения оценкой для 16 ГБ.
      cuda_arena_limit_mb: null
      # Рост ровно на запрос: арена не резервирует лишнюю степень двойки рядом с будущим VLM.
      cuda_arena_extend_strategy: kSameAsRequested
      trt_workspace_mb: null
      # CUDA arena и TensorRT workspace не ограничивают всю VRAM процесса: веса, контекст,
      # декодеры и другие сессии измеряются дополнительно под общей нагрузкой.
    # onnxruntime — разработка и CI (CPU); tensorrt — объект (FP16-движок строится на месте).
    # auto: TensorRT FP16 в образе GPU (движок строится на месте, SPEC.md §5.7), иначе CUDA, иначе CPU.
    runtime: auto
    models_dir: /var/lib/qoima/models/registry   # артефакты моделей (ONNX); манифесты — models/registry/
    person_model: rfdetr-person                  # RF-DETR, Apache-2.0, COCO pretrained (SPEC.md §5.12)
    pose_model: rtmpose-body                     # выбор RTMPose / RF-DETR keypoints — по бенчмарку на клипах
    # Детекции ниже 0.1 отбрасываются сразу; 0.1–0.5 нужны только второму этапу сопоставления
    # ByteTrack (tracker.low_score), в FSM они не попадают.
    person_score_min: 0.1
    pose_keypoint_min: 0.3      # ключевая точка позы с уверенностью < 0.3 считается невидимой
    max_batch: 16               # кадров разных камер в одном батче; уточняется бенчмарком (Фаза 3)
    threads: 4                  # потоков CPU для onnxruntime в режиме разработки
    timeout_s: 5                # инференс дольше 5 с — модель зависла: кадр пропускается, ошибка в метриках и логе
  tracker:
    # Двухэтапное сопоставление в стиле ByteTrack: уверенные детекции (≥ 0.5) — с IoU ≥ 0.3,
    # затем слабые (≥ 0.1) — с оставшимися треками при IoU ≥ 0.5. Слабые детекции спасают трек
    # человека, который частично загорожен, — это важно для падений за оборудованием.
    high_score: 0.5
    low_score: 0.1
    match_iou: 0.3
    low_match_iou: 0.5
    max_lost_s: 2.0             # трек без детекций дольше 2 с закрывается (время, а не кадры: FPS адаптивный)
    min_hits: 3                 # трек подтверждается после 3 совпадений — отсекает одиночные ложные боксы
  motion:
    # SPEC.md §5.4: детектор движения — разность кадров на копии 160×90.
    width: 160
    height: 90
    pixel_delta: 25          # изменение яркости пикселя > 25 — движение, а не шум сенсора (уточняется)
    changed_ratio: 0.002     # > 0.2% изменившихся пикселей (~29 px на 160×90) — есть движение
    idle_fps: 1.0            # SPEC.md §5.4: без движения — «сторожевой» 1 FPS
    # После движения полный FPS держится ещё 2 с: упавший человек замирает, а FSM нужен
    # полный FPS, чтобы зафиксировать переход в DOWN.
    active_hold_s: 2.0
  batching:
    max_queue_delay_ms: 20   # SPEC.md §5.6: батчинг через камеры не дольше 20 мс
  # SPEC.md §5.11: deepstream рекомендуется при > ~16–24 камерах; точный порог даст бенчмарк
  # (Фаза 3). Пока берём нижнюю границу, чтобы планировщик предупреждал заранее.
  deepstream_recommend_from_cameras: 16

routing:
  # SPEC.md §5.10: ожидаемый поток запросов к VLM не должен превышать 70% измеренной
  # пропускной способности — запас на всплески, иначе очередь арбитра растёт без предела.
  vlm_max_load_ratio: 0.7

vlm:
  arbiter_timeout_s: 4.0     # SPEC.md §9.1: таймаут 4 с → fail-open
  max_output_retries: 2      # SPEC.md §9: ≤ 2 повтора при невалидном выводе, затем ошибка
  shadow_days: 7             # SPEC.md §3.2 шаг 9: арбитр 7 дней в shadow mode
  min_vram_gb: 24            # SPEC.md §4.1: минимум VRAM для карты с VLM
  roi_frames: 4              # SPEC.md §9.1: 3–4 кадра с ROI-кропом; берём верхнюю границу

incidents:
  # События одного типа в одной зоне в пределах 60 с объединяются в один инцидент
  # (SPEC.md §7: «повтор в двух камерах → один инцидент»). Уточняется, Фаза 2.
  dedup_window_s: 60
  # После закрытия инцидента новый того же типа в той же зоне не открывается 120 с,
  # чтобы оператор не получал серию алертов про одну ситуацию. Уточняется, Фаза 2.
  cooldown_s: 120
  clip_pre_s: 15             # SPEC.md §7: клип −15/+15 с
  clip_post_s: 15
  keyframes_min: 4           # SPEC.md §7: 4–6 ключевых кадров
  keyframes_max: 6

canary:
  interval_minutes: 30       # SPEC.md §6.1: канарейка каждые 30 минут
  clip: samples/e2e/fall_staged.mp4   # предоставит команда (SPEC.md §11 samples/e2e)
  # Пока клипа нет, канарейка проверяет путь «событие → инцидент → клип → системный канал»
  # тестовым событием на реальной камере (без детекции). Полная канарейка с клипом — когда он появится.
  alert_path_enabled: true
  timeout_s: 60     # событие должно дойти до системного канала за минуту, иначе — системный алерт

health:
  # Проверка одного компонента в разделе «Состояние системы» не дольше 2 с: страница
  # обновляется раз в 5 с и не должна зависать из-за одного недоступного сервиса.
  component_timeout_s: 2.0
  disk_warn_free_ratio: 0.15      # < 15% свободно — жёлтый: пора чистить или расширять диск
  disk_critical_free_ratio: 0.05  # < 5% — красный: клипы инцидентов могут не записаться

discovery:
  # Поиск камер (мастер, шаг 3). Запускается только вручную кнопкой «Найти камеры»:
  # сканирование сети завода не должно идти фоном (его видят системы обнаружения вторжений).
  # Подсети по умолчанию — подсети сетевых интерфейсов сервера (qoima up передаёт их в core-api);
  # здесь можно добавить подсети камер, если они в другом VLAN.
  subnets: []
  onvif_ports: [80, 8080, 8000, 8899]   # типовые порты ONVIF device service у производителей
  rtsp_ports: [554, 8554]               # стандартный RTSP и частый альтернативный
  ws_discovery_timeout_s: 3   # ответы WS-Discovery приходят за сотни мс; 3 с — с запасом
  connect_timeout_s: 0.5      # TCP-подключение в локальной сети — единицы мс; 0.5 с отсекает «тишину»
  onvif_timeout_s: 5          # SOAP-запросы к камере (GetProfiles, GetStreamUri)
  # Не больше 4096 адресов за один поиск (16 подсетей /24): сеть /16 целиком сканировать нельзя.
  max_hosts: 4096
  concurrency: 256            # одновременных TCP-подключений при сканировании

probe:
  timeout_s: 10      # открытие RTSP-потока; камеры за NVR отвечают до нескольких секунд
  read_seconds: 4    # читаем 4 с потока: хватает на FPS, битрейт и минимум один I-кадр (GOP ≤ 4 с)
  max_parallel: 4    # параллельных зондирований: камеры и NVR плохо переносят много сессий сразу

auth:
  session_ttl_hours: 12        # сессия живёт одну смену (12 ч), затем вход заново
  password_min_length: 10
  max_failed_logins: 10        # после 10 неудачных попыток подряд вход блокируется…
  lockout_minutes: 5           # …на 5 минут — защита от перебора без риска надолго запереть смену

system_alerts:
  # Компонент красный 3 проверки подряд (30 с при опросе раз в 10 с) → системный алерт.
  # Одиночный таймаут при перезапуске сервиса алерт не поднимает.
  component_down_after_checks: 3
  health_poll_interval_s: 10
  # Отчёт qoima doctor старше 15 минут считается устаревшим (таймер запускает его раз в 5 минут).
  doctor_report_max_age_minutes: 15

doctor:
  # Клипы 30 дней + датасеты + модели + Postgres. 200 ГБ — минимум для ~24 камер; точную
  # оценку под число камер даст планировщик мощности (Фаза 3).
  # Объект: клипы 30 дней, модели, датасеты и обучение (Фазы 6–7), веса VLM (Фаза 4) — docs/ADMIN_GUIDE.md.
  min_free_disk_gb: 200
  # Стенд WSL2 для проверки: образы (~30 ГБ вместе с Triton и GPU-вариантом пайплайна), кэш сборки
  # (~15 ГБ), модели и клипы проверки — 80 ГБ с запасом (docs/WINDOWS.md).
  wsl_min_free_disk_gb: 80
  # Стенд WSL2 (Windows): Postgres, Qdrant, Triton, видеобуфер и модели не помещаются в 8 ГБ,
  # которые WSL берёт по умолчанию на 16-гигабайтной машине (docs/WINDOWS.md).
  wsl_min_memory_gb: 16
  # Расхождение часов > 50 мс ломает сопоставление событий разных камер и SLO-метрики.
  max_clock_offset_ms: 50
  # Образ Triton 26.08 собран на CUDA 13.4: драйвер должен поддерживать CUDA 13.x
  # (ветка R580+; minor-совместимость CUDA). Значение берётся из шапки nvidia-smi.
  min_driver_cuda_version: "13.0"
  min_docker_version: "24.0"      # стабильная поддержка `compose up --wait` и GPU-резервирования
  min_compose_version: "2.20"     # --wait/--wait-timeout и include в compose v2

bench:
  # `qoima bench` (SPEC.md §3.2 шаг 6). Каждый замер повторяется, разброс (CV) идёт в отчёт:
  # план должен быть воспроизводим, а не держаться на одном удачном прогоне.
  repeats: 3
  decode_seconds: 5            # длительность одного прогона декодирования при данном числе потоков
  decode_sample_seconds: 10    # столько видео записывается с каждой камеры для замера (≥ 2 GOP)
  max_parallel_decoders: 64    # предел перебора параллельных декодеров (100 камер — это ≥ 64)
  saturation_gain: 0.05        # прирост < 5% при удвоении потоков — декодер насыщен
  synthetic_profiles:          # если камер нет: типовые substream (≤ 720p, SPEC.md §5.1) и mainstream
    - {codec: h264, width: 640, height: 360, fps: 15}
    - {codec: h264, width: 1280, height: 720, fps: 15}
    - {codec: h264, width: 1920, height: 1080, fps: 25}
  model_batches: [1, 2, 4, 8, 16]   # до pipeline.inference.max_batch
  model_warmup: 5              # прогрев: первые вызовы (сборка движка TensorRT, аллокации) не считаются
  model_iterations: 30         # достаточно для p95 на 30 точках при CV < 10% (проверяется отчётом)
  vram_sample_interval_s: 0.01  # опрос NVML 100 Гц внутри загрузки/инференса; более короткие пики могут быть пропущены
  vlm_concurrency: [1, 2, 4, 8]
  vlm_requests_per_level: 16
  vlm_timeout_s: 30            # один запрос арбитра дольше 30 с — VLM считается неработоспособным

capacity:
  # Планировщик мощности (Фаза 3). Значения, помеченные «оценка», заменяются фактическими
  # данными объекта по мере работы (статистика событий, метрики пайплайна) — docs/ASSUMPTIONS.md.
  utilization_target: 0.8      # планируем ≤ 80% измеренной ёмкости: запас на всплески и фоновые задачи
  motion_duty_cycle: 0.5       # оценка: половину времени в кадре есть движение (консервативно для цехов)
  persons_per_frame: 2         # оценка: средне людей в кадре при анализе позы
  gray_requests_per_camera_hour: 4   # оценка потока к арбитру, пока нет статистики событий
  gray_stats_days: 7           # статистика серой зоны — за неделю (неделя покрывает все смены)
  gray_stats_min_events: 20    # меньше 20 событий — статистике не верим, берём оценку
  gray_zone_min_width: 0.05    # серая зона не сужается до нуля: арбитр нужен на спорных случаях
  # Порядок важности сценариев: FPS понижается сначала у последних в списке. Падение и
  # дым/огонь — critical, опасная зона — high (docs/ASSUMPTIONS.md, п. 39).
  scenario_priority: [fall, smoke_fire, red_zone]
  fps_step: 1.0                # шаг понижения FPS при нехватке ёмкости
  inference_latency_budget_ms: 250   # батч, у которого p95 дольше, не берём: SLO «падение → алерт» ≤ 2 с
  vlm_min_valid_json_ratio: 0.95     # VLM с > 5% невалидных ответов не считается рабочим на этой нагрузке
  cuda_context_mb: 500         # контекст CUDA процесса пайплайна (уточняется замером в отчёте)
  vram_reserve_mb: 2048        # запас VRAM на фрагментацию и пики
  triton_reserve_mb: 2048      # кастомные модели (Фаза 7); пока Triton пуст — резерв
  llm_min_mb: 14000            # оценка: Qwen3-VL-8B FP8 ≈ 9 ГБ весов + KV-кэш на несколько запросов (Фаза 4)
  ram_base_mb: 8192            # оценка: Postgres, Qdrant, Valkey, сервисы Qoima без видеобуфера
  ram_max_ratio: 0.7           # базовые сервисы + GOP-буферы ≤ 70% ОЗУ: запас ОС и кэшу файлов (клипы)
