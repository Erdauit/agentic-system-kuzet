# Сценарий «Падение и лежание» (SPEC.md §5.8, FallFSM).
# STANDING → FALLING → DOWN → (lying_seconds) → ALERT; возврат в STANDING пишет микро-инцидент.
scenario: fall
safety_class: true     # класс безопасности: фидбек не может снизить чувствительность (SPEC.md §2.6)
target_fps: 8          # SPEC.md §5.4: 5–10 FPS; 8 — запас на быстрые падения при умеренной нагрузке
lying_seconds: 10      # SPEC.md §5.8: таймер лежания по умолчанию 10 с
# Стартовая серая зона. P > t_high — событие; t_low ≤ P ≤ t_high — событие + арбитр.
# Пересчитывается Trainer/Evaluator по golden set и ограничивается ёмкостью VLM (Фазы 3, 7).
thresholds: {t_low: 0.4, t_high: 0.8}
# Признаки «лежит» (SPEC.md §5.8). Стартовые значения, уточняются на клипах объекта.
torso_lying_deg: 60      # корпус (плечи → бёдра) отклонён от вертикали кадра больше чем на 60°
bbox_lying_aspect: 1.3   # без позы: ширина бокса ≥ 1.3 высоты — человек горизонтален
# Падение — резкое смещение центра масс вниз: ≥ 30% роста человека за 1.5 с. Медленно лечь
# (ремонт лёжа) — не падение: такие случаи FSM ведёт к DOWN без FALLING и помечает в событии.
drop_ratio: 0.3
drop_window_s: 1.5
# «Неподвижен»: центр масс смещается меньше чем на 5% роста за окно наблюдения.
still_ratio: 0.05
recover_seconds: 2.0     # встал и стоит 2 с — FSM сбрасывается, пишется микро-инцидент
