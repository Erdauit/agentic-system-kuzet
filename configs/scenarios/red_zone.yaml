# Сценарий «Красная зона» (SPEC.md §5.8, RedZoneFSM).
scenario: red_zone
safety_class: true
target_fps: 5            # SPEC.md §5.4: зона — 5 FPS
# Точка опоры внутри полигона дольше 0.5 с → событие. Короче — ложные срабатывания на
# прохожих у границы; длиннее — не уложимся в SLO 1 с. Переопределяется на уровне зоны.
dwell_seconds: 0.5
# Гистерезис: человек считается вышедшим, только если пробыл вне зоны 1 с —
# подавляет дребезг на границе полигона.
exit_hysteresis_s: 1.0
thresholds: {t_low: 0.4, t_high: 0.75}   # стартовые, см. fall.yaml
