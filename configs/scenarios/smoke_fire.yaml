# Сценарий «Дым и огонь» (SPEC.md §5.8, SmokeFireFSM).
scenario: smoke_fire
safety_class: true
target_fps: 3              # SPEC.md §5.4: 2–4 FPS — дым развивается секундами, не кадрами
# Окно анализа динамики: кандидат должен расти или двигаться в течение 6 с (≥ 18 кадров
# при 3 FPS). Укладывается в SLO 3 с для кандидата за счёт раннего алерта с арбитром.
# Модель дыма/огня — веса Qoima в models/registry (SPEC.md §5.12). Нет весов — сценарий
# честно не работает (not_deployed), обучение — AutoML-граф (Фаза 7).
model: qoima-smoke-fire
window_seconds: 6
min_candidate_frames: 6   # кандидат должен быть виден ≥ 6 кадров окна (2 с при 3 FPS)
min_area_growth_ratio: 0.15   # рост площади ≥ 15% за окно — признак развития (уточняется, Фаза 2)
respect_work_schedule: true   # учитывать расписание сварки/пропарки из конфигурации зоны
thresholds: {t_low: 0.35, t_high: 0.7}   # стартовые, см. fall.yaml
