# Конфиг Alembic для разработчиков (autogenerate). Сервисы вызывают миграции из кода:
# core_api.db.migrate. URL БД берётся из окружения ($QOIMA_DATABASE_URL), не из этого файла.
[alembic]
script_location = %(here)s/migrations
file_template = rev_%%(rev)s_%%(slug)s
prepend_sys_path = .

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)s [%(name)s] %(message)s
