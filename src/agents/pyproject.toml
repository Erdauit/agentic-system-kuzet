[project]
name = "qoima-agents"
version = "0.2.0"
description = "agents: LangGraph-графы и плейбуки агентов"
requires-python = ">=3.12"
license = "LicenseRef-Qoima-Proprietary"
dependencies = [
    "qoima-shared[postgres,valkey]",
]

[tool.uv.sources]
qoima-shared = { workspace = true }

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# Каталог пакета совпадает с корнем проекта (src/agents) — так сохраняется структура из SPEC.md §11.
# sources добавляет префикс "agents/" ко всем файлам колеса; dev-mode-dirs кладёт src/ в sys.path
# для editable-установки при разработке.
[tool.hatch.build.targets.wheel]
include = ["**/*.py", "**/*.pyi", "**/*.yaml", "**/*.json", "**/*.md", "**/*.mako", "py.typed"]
exclude = ["pyproject.toml", "**/__pycache__"]
dev-mode-dirs = [".."]

[tool.hatch.build.targets.wheel.sources]
"" = "agents"
